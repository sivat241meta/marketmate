<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: "Noto Sans";
  src: url("{{ fonts_uri }}/NotoSans-Regular.ttf");
}
@font-face {
  font-family: "Noto Sans";
  font-weight: bold;
  src: url("{{ fonts_uri }}/NotoSans-Bold.ttf");
}
@font-face {
  font-family: "Noto Sans Tamil";
  src: url("{{ fonts_uri }}/NotoSansTamil-Regular.ttf");
}
@font-face {
  font-family: "Noto Sans Tamil";
  font-weight: bold;
  src: url("{{ fonts_uri }}/NotoSansTamil-Bold.ttf");
}
@font-face {
  font-family: "Noto Sans Devanagari";
  src: url("{{ fonts_uri }}/NotoSansDevanagari-Regular.ttf");
}
@font-face {
  font-family: "Noto Sans Devanagari";
  font-weight: bold;
  src: url("{{ fonts_uri }}/NotoSansDevanagari-Bold.ttf");
}
@font-face {
  font-family: "Noto Sans Bengali";
  src: url("{{ fonts_uri }}/NotoSansBengali-Regular.ttf");
}
@font-face {
  font-family: "Noto Sans Bengali";
  font-weight: bold;
  src: url("{{ fonts_uri }}/NotoSansBengali-Bold.ttf");
}
@font-face {
  font-family: "Noto Sans Telugu";
  src: url("{{ fonts_uri }}/NotoSansTelugu-Regular.ttf");
}
@font-face {
  font-family: "Noto Sans Telugu";
  font-weight: bold;
  src: url("{{ fonts_uri }}/NotoSansTelugu-Bold.ttf");
}
@font-face {
  font-family: "Noto Sans Kannada";
  src: url("{{ fonts_uri }}/NotoSansKannada-Regular.ttf");
}
@font-face {
  font-family: "Noto Sans Kannada";
  font-weight: bold;
  src: url("{{ fonts_uri }}/NotoSansKannada-Bold.ttf");
}
@page { size: A5 landscape; margin: 12mm; }
body {
  font-family: "Noto Sans", "Noto Sans Tamil", "Noto Sans Devanagari", "Noto Sans Bengali", "Noto Sans Telugu", "Noto Sans Kannada", system-ui, sans-serif;
  color: #292D34; background: #FFFFFF;
}
.card {
  border: 3px solid #7B68EE; border-radius: 18px; padding: 24px;
  text-align: center;
}
h1 { color: #292D34; font-size: 30px; margin: 0 0 4px; }
h1 img.brand { height: 30px; width: 30px; vertical-align: -5px; margin-right: 8px; }
.shop { font-size: 20px; margin: 0 0 12px; }
img.qr { width: 220px; height: 220px; }
.url { font-size: 13px; word-break: break-all; color: #3C4048; }
.warn {
  display: inline-block; margin-top: 12px; padding: 8px 16px;
  background: #FFF5E3; color: #8A5208; border-radius: 12px;
  font-weight: bold; font-size: 16px;
}
</style>
</head>
<body>
<div class="card">
  <h1><img class="brand" src="{{ brand_uri }}/mark.svg" alt="MarketMate">{{ t('set.keep_safe') }} — MarketMate</h1>
  <p class="shop">{{ shop["name"] }}</p>
  <img class="qr" src="{{ qr_data_uri }}" alt="seller link QR">
  <p class="url">{{ seller_url }}</p>
  <p class="warn">{{ t('set.keep_safe_desc') }}</p>
</div>
</body>
</html>
