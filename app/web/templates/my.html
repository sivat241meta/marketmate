{% extends "base.html" %}
{% import "_ui.html" as ui %}
{% block title %}{{ t('my.title') }}{% endblock %}
{% block content %}
<div data-my-page data-empty-orders="{{ t('my.empty_orders') }}" data-empty-shops="{{ t('my.empty_shops') }}" data-order-pattern="{{ t('bills.order_num', id='{n}') }}">
  <p class="kick">{{ t('my.title') }}</p>
  <h1 class="big">{{ t('my.orders') }}</h1>
  <div data-my-orders></div>
  <h2 class="h2s">{{ t('my.shops') }}</h2>
  <div data-my-shops></div>
  <p><button class="pill ghost" type="button" data-my-clear>{{ t('my.clear') }}</button></p>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ static_url('my.js') if static_url is defined else '/static/my.js' }}"></script>
{% endblock %}
